<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sales Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container my-4">
    <h1 class="mb-4">Sales Summary</h1>
    <div class="mb-3">
        <h4>Total Sales: <span id="total-sales">0</span></h4>
    </div>
    <table class="table table-striped" id="sales-table">
        <thead>
            <tr>
                <th>Item</th>
                <th>Sales</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('data.csv')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.text();
            })
            .then(csvText => {
                const lines = csvText.trim().split('\n');
                let totalSales = 0;
                const tbody = document.querySelector('#sales-table tbody');
                lines.forEach(line => {
                    const [item, salesStr] = line.split(',');
                    const sales = parseFloat(salesStr);
                    if (!isNaN(sales)) {
                        totalSales += sales;
                        const row = document.createElement('tr');
                        const itemTd = document.createElement('td');
                        itemTd.textContent = item;
                        const salesTd = document.createElement('td');
                        salesTd.textContent = sales.toFixed(2);
                        row.appendChild(itemTd);
                        row.appendChild(salesTd);
                        tbody.appendChild(row);
                    }
                });
                document.getElementById('total-sales').textContent = totalSales.toFixed(2);
            })
            .catch(error => {
                console.error('Error fetching or parsing CSV:', error);
                document.getElementById('total-sales').textContent = 'Error';
            });
    });
</script>
</body>
</html>
